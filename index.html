<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-snap-type: y mandatory;
    overflow-y: scroll;
    height: 100%;
  }

  body {
    height: 100%;
    font-family: 'DM Sans', sans-serif;
    background: #000;
  }

  .section {
    height: 100vh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* VIDEO BACKGROUND */
  .hero-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  /* Dark overlay so text reads clearly */
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.15) 0%,
      rgba(0,0,0,0.35) 60%,
      rgba(0,0,0,0.55) 100%
    );
    z-index: 1;
  }

  /* CONTENT */
  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
    max-width: 820px;
    animation: fadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .hero-eyebrow {
    display: inline-block;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    margin-bottom: 1.5rem;
    animation: fadeUp 1.1s 0.1s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .hero-headline {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3rem, 8vw, 6.5rem);
    font-weight: 300;
    line-height: 1.05;
    color: #fff;
    letter-spacing: -0.01em;
    margin-bottom: 1.5rem;
    animation: fadeUp 1.1s 0.18s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .hero-sub {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(0.95rem, 2vw, 1.1rem);
    font-weight: 300;
    color: rgba(255,255,255,0.75);
    line-height: 1.7;
    max-width: 520px;
    margin: 0 auto 2.8rem;
    animation: fadeUp 1.1s 0.26s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* CTA GROUP */
  .cta-group {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
    animation: fadeUp 1.1s 0.34s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* PRIMARY BUTTON */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.9rem 2.2rem;
    background: #fff;
    color: #111;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-decoration: none;
    border-radius: 2px;
    transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }

  .btn-primary:hover {
    background: rgba(255,255,255,0.88);
    transform: translateY(-1px);
  }

  .btn-primary:active {
    transform: translateY(0px);
  }

  /* SECONDARY LINK */
  .link-secondary {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 400;
    color: rgba(255,255,255,0.8);
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.3);
    padding-bottom: 1px;
    letter-spacing: 0.02em;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .link-secondary:hover {
    color: #fff;
    border-color: rgba(255,255,255,0.8);
  }

  .link-secondary svg {
    transition: transform 0.2s ease;
  }

  .link-secondary:hover svg {
    transform: translateX(3px);
  }

  /* SCROLL INDICATOR */
  .scroll-hint {
    position: absolute;
    bottom: 2.2rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    animation: fadeIn 1.5s 1s both;
  }

  .scroll-hint span {
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    font-family: 'DM Sans', sans-serif;
  }

  .scroll-line {
    width: 1px;
    height: 40px;
    background: rgba(255,255,255,0.2);
    position: relative;
    overflow: hidden;
    border-radius: 1px;
  }

  .scroll-line::after {
    content: '';
    position: absolute;
    top: -40px;
    left: 0;
    width: 100%;
    height: 40px;
    background: rgba(255,255,255,0.7);
    animation: scrollDrop 1.6s 1.2s ease-in-out infinite;
  }

  /* PLACEHOLDER SECTION (next snap point) */
  .next-section {
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .next-section p {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes scrollDrop {
    0%   { top: -40px; opacity: 1; }
    80%  { top: 40px;  opacity: 0.4; }
    100% { top: 40px;  opacity: 0; }
  }

  /* MOBILE */
  @media (max-width: 600px) {
    .hero-content { padding: 1.5rem; }
    .cta-group { gap: 1.4rem; }
    .btn-primary { padding: 0.85rem 1.8rem; }
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════
     HERO SECTION — replace video src with your MP4 URL
     ═══════════════════════════════════════ -->
<section class="section">

  <!-- YOUR VIDEO — swap src with your hosted MP4 link -->
  <video
    class="hero-video"
    src="YOUR_VIDEO_URL_HERE.mp4"
    autoplay
    loop
    muted
    playsinline
    preload="auto"
    poster="YOUR_POSTER_IMAGE_HERE.jpg"
  ></video>

  <div class="hero-overlay"></div>

  <div class="hero-content">

    <!-- Optional eyebrow label — delete if not needed -->
    <span class="hero-eyebrow">Your tagline or category here</span>

    <!-- Main headline — edit to match your Canva design -->
    <h1 class="hero-headline">Your Headline<br>Goes Right Here</h1>

    <!-- Supporting subtext — edit or delete -->
    <p class="hero-sub">
      A brief line or two that supports your headline and tells visitors exactly what you do or offer.
    </p>

    <div class="cta-group">

      <!-- PRIMARY BUTTON — update href and label -->
      <a href="YOUR_BUTTON_URL_HERE" class="btn-primary">
        Get Started
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>

      <!-- SECONDARY LINK — update href and label -->
      <a href="YOUR_LINK_URL_HERE" class="link-secondary">
        Learn more
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>

    </div>
  </div>

  <!-- Scroll down indicator -->
  <div class="scroll-hint" aria-hidden="true">
    <span>Scroll</span>
    <div class="scroll-line"></div>
  </div>

</section>


<!-- ═══════════════════════════════════════
     NEXT SNAP SECTION
     Replace this with your next Canva section content,
     or delete it entirely if this iframe only houses the hero.
     ═══════════════════════════════════════ -->
<section class="section next-section">
  <p>Next section</p>
</section>


</body>
</html>
